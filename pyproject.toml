[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "py3dtools"
version = "0.0.4"
description = "3D file format conversion tools"
authors = ["Aravind Sundararajan <aravind.sundararajan@protonmail.com>"]
readme = "README.md"
packages = [{include = "py3dtools"}]

[tool.poetry.dependencies]
python = "^3.8"
vtk = "^9.4.2"

[tool.poetry.group.dev.dependencies]
ruff = "^0.1.0"
pytest = "^7.0.0"

[tool.poetry.scripts]
vtp2stl = "py3dtools.cli.vtp2stl_cli:main"
stl2obj = "py3dtools.cli.stl2obj_cli:main"
mirrorobj = "py3dtools.cli.mirrorobj_cli:main"
stl2vtp = "py3dtools.cli.stl2vtp_cli:main"
obj2stl = "py3dtools.cli.obj2stl_cli:main"
obj2vtp = "py3dtools.cli.obj2vtp_cli:main"
meshdecimator = "py3dtools.cli.mesh_decimator_cli:main"

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"] 