[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "py3dtools"
version = "0.0.4"
description = "3D file format conversion tools"
authors = ["Aravind Sundararajan <aravind.sundararajan@protonmail.com>"]
readme = "README.md"
packages = [{include = "py3dtools"}]

[tool.poetry.dependencies]
python = "^3.11.9"
vtk = "^9.4.2"

[tool.poetry.group.dev.dependencies]
ruff = "^0.12.0"
pytest = "^7.0.0"
mypy = "^1.17.0"

[tool.poetry.scripts]
vtp2stl = "py3dtools.cli.vtp2stl_cli:main"
stl2obj = "py3dtools.cli.stl2obj_cli:main"
mirrorobj = "py3dtools.cli.mirrorobj_cli:main"
stl2vtp = "py3dtools.cli.stl2vtp_cli:main"
obj2stl = "py3dtools.cli.obj2stl_cli:main"
obj2vtp = "py3dtools.cli.obj2vtp_cli:main"
meshdecimator = "py3dtools.cli.mesh_decimator_cli:main"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["UP"]

[tool.mypy]
python_version = "3.11"
files = ["py3dtools", "test", "doc"]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "vtk"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"] 